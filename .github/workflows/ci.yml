name: Build and Test

on:
  push:
    branches: [master, develop, feat/po/tl-13-homework]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Compose
        uses: hoverkraft-tech/compose-action@v2.0.1
        with:
          compose-file: ./docker-compose.yaml
          up-flags: -d

      - name: Wait for server to start
        run: sleep 10

      - name: Run tests for an empty array
        run: npx playwright test tests/empty-user.api.spec.ts

      - name: Run the remaining tests
        run: npx playwright test tests/user.api.spec.ts
